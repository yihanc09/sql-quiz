[project]
name = "ids706-sql-quiz"
version = "0.1.0"
requires-python = ">=3.12"
# Only backend runtime dependencies are installed by the Vercel build.
# requirements.txt also includes the local Streamlit interface and test runner.
dependencies = [
    "supabase",
    "psycopg[binary]",
    "pandas",
    "python-dotenv",
    "cryptography",
    "httpx>=0.27,<1",
    "chromadb-client==1.5.9",
]

[tool.uv]
package = false

[tool.vercel]
# app.py is the original Streamlit UI, not the HTTP application.
entrypoint = "web_server:handler"

[tool.pytest.ini_options]
# Default checks are offline; use `python -m pytest tests/integration` for Supabase.
testpaths = ["tests/unit"]
pythonpath = ["."]
cache_dir = ".cache/pytest"
